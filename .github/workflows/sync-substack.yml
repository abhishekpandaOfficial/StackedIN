name: Sync Substack posts

on:
  push:
    branches: [master]
    paths:
      - "scripts/sync-substack.mjs"
      - "data/posts.seed.json"
      - ".github/workflows/sync-substack.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: substack-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Discover Substack posts
        run: node scripts/sync-substack.mjs
      - name: Commit changed catalogue
        run: |
          if git diff --quiet -- public/posts.json; then
            echo "Catalogue is already current."
            exit 0
          fi
          git config user.name "abhishek-studio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/posts.json
          git commit -m "Sync latest Substack posts"
          git push
      - name: Install dependencies
        run: npm ci
      - name: Build refreshed dashboard
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy refreshed dashboard
        id: deployment
        uses: actions/deploy-pages@v4
